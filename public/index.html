<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>내 전화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <h1>내 전화</h1>
    <p class="muted">나만 쓰는 인터넷 전화와 문자입니다.</p>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">로그인</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</section>

<div id="app" class="app" hidden>
  <header class="bar">
    <div>
      <div class="muted small">내 번호</div>
      <div class="mono" id="myNumber">-</div>
    </div>
    <div class="bar-right">
      <span class="dot" id="voiceDot" title="전화 연결 상태"></span><span class="small" id="voiceState">전화 준비 중</span>
      <button class="link" id="logout" type="button">로그아웃</button>
    </div>
  </header>

  <div class="notice" id="setupNotice" hidden></div>

  <div class="incoming" id="incoming" hidden role="alert">
    <div><div class="muted small">걸려오는 전화</div><div class="mono big" id="incomingFrom"></div></div>
    <div class="row"><button class="btn ok" id="accept" type="button">받기</button><button class="btn bad" id="reject" type="button">거절</button></div>
  </div>

  <main>
    <section id="tab-sms" class="tab on">
      <div id="convList">
        <div class="row between"><h2>문자</h2><button class="btn small" id="newMsg" type="button">새 문자</button></div>
        <ul class="list" id="convs"></ul>
        <p class="muted empty" id="convEmpty">아직 받은 문자가 없습니다. 내 번호로 문자가 오면 여기에 나타납니다.</p>
      </div>
      <div id="thread" hidden>
        <div class="row"><button class="link" id="back" type="button">← 목록</button><strong class="mono" id="threadPeer"></strong></div>
        <div id="newTo" class="newto" hidden>
          <label for="toInput">받는 번호</label>
          <input id="toInput" inputmode="tel" placeholder="+821012345678" autocomplete="off">
        </div>
        <div class="bubbles" id="bubbles"></div>
        <form id="composer" class="composer">
          <label class="sr" for="msgBody">문자 내용</label>
          <textarea id="msgBody" rows="2" maxlength="1600" placeholder="문자 내용"></textarea>
          <button class="btn" type="submit" id="sendBtn">보내기</button>
        </form>
        <p class="err" id="smsErr" role="alert"></p>
      </div>
    </section>

    <section id="tab-call" class="tab">
      <h2>전화</h2>
      <label for="dialInput">걸 번호</label>
      <input id="dialInput" class="dial-input mono" inputmode="tel" placeholder="+821012345678" autocomplete="off">
      <div class="pad" id="pad"></div>
      <div class="row">
        <button class="btn ok wide" id="callBtn" type="button">전화 걸기</button>
        <button class="btn bad wide" id="hangBtn" type="button" hidden>끊기</button>
      </div>
      <p class="muted" id="callState"></p>
    </section>

    <section id="tab-log" class="tab">
      <h2>통화 기록</h2>
      <ul class="list" id="calls"></ul>
      <p class="muted empty" id="callsEmpty">통화 기록이 없습니다.</p>
    </section>
  </main>

  <nav class="tabs" aria-label="메뉴">
    <button data-tab="sms" class="on" type="button">문자</button>
    <button data-tab="call" type="button">전화</button>
    <button data-tab="log" type="button">기록</button>
  </nav>
</div>
<script src="/vendor/twilio.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
